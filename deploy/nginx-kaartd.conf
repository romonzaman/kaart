# Kaart served under https://agent.mkzaman.com/kaartd/
#
#   UI    https://agent.mkzaman.com/kaartd/
#   API   https://agent.mkzaman.com/kaartd/api/
#
# agent.mkzaman.com already exists and serves other things, so this is a
# fragment to include inside that server block rather than a server block of
# its own:
#
#   server {
#       server_name agent.mkzaman.com;
#       ...
#       include /etc/nginx/snippets/kaartd.conf;
#   }
#
# Install to /etc/nginx/snippets/kaartd.conf.
#
# The bundle lives at /var/www/kaart/kaartd/ — the directory name repeats the
# URL prefix on purpose. `alias` plus `try_files` misresolves the SPA fallback
# (a long-standing nginx behaviour), so the prefix is matched by `root` against
# a real directory of the same name instead.

# --- access control -------------------------------------------------------
#
# kaartd has NO authentication. Once this snippet is live, every card and every
# review at /kaartd/api/ is readable and writable by anyone who finds the URL.
#
# If agent.mkzaman.com does not already authenticate at the server level,
# uncomment the two lines below after creating the password file:
#
#   apt install apache2-utils
#   htpasswd -c /etc/nginx/kaart.htpasswd yourname
#
# They are commented rather than enabled because nginx returns 500 for every
# request if auth_basic_user_file points at a file that does not exist.
#
# Same-origin fetch sends credentials by default, so the app needs no change:
# the browser prompts once and attaches the header to /kaartd/api/ after that.
#
#auth_basic           "Kaart";
#auth_basic_user_file /etc/nginx/kaart.htpasswd;

# Without this, https://agent.mkzaman.com/kaartd (no slash) 404s.
location = /kaartd {
    return 301 /kaartd/;
}

# --- the API: /kaartd/api/v1/... -> 127.0.0.1:8080/api/v1/... ---
#
# The trailing slash on proxy_pass is what strips the /kaartd prefix. Without
# it kaartd would receive /kaartd/api/v1/decks and answer 404 for everything.
location /kaartd/api/ {
    proxy_pass http://127.0.0.1:7280/api/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;

    # Card fronts and backs are small; the cap stops a stray upload.
    client_max_body_size 1m;
}

# Health check. Exact match, so it takes precedence over the prefixes above.
location = /kaartd/healthz {
    auth_basic off;               # harmless when auth_basic is not enabled
    proxy_pass http://127.0.0.1:7280/healthz;
    proxy_set_header Host $host;
    access_log off;
}

# --- the web app ---

# Hashed filenames, so they can be cached hard. Longer prefix than /kaartd/,
# so nginx picks this first.
location /kaartd/_expo/ {
    root /var/www/agent.mkzaman.com;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location /kaartd/assets/ {
    root /var/www/agent.mkzaman.com;
    expires 30d;
    try_files $uri =404;
}

# app.json sets web.output "single", so every route is served by index.html and
# expo-router takes over client-side. Deep links like /kaartd/deck/abc/study
# have to reach index.html rather than 404.
location /kaartd/ {
    root /var/www/agent.mkzaman.com;
    try_files $uri $uri/ /kaartd/index.html;

    # index.html must not be cached, or a deploy leaves browsers pointed at a
    # bundle filename that no longer exists.
    location = /kaartd/index.html {
        root /var/www/agent.mkzaman.com;
        add_header Cache-Control "no-store";
    }
}
